    <div class="loader-bar" aria-hidden="true"><i></i></div>
    <p>Carregando plataforma…</p>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">∑</div>

      <button class="close-menu" id="closeMenu" aria-label="Fechar menu">×</button>
      <nav class="nav">

          <div class="score-pill">★ <span id="topScore">0</span> pts</div>
        </div>

      <div id="app"></div>
